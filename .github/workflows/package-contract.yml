name: Package contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            xcode: "15.2"
          - runner: macos-15
            xcode: "16.2"
          - runner: macos-15
            xcode: "16.3"
          - runner: macos-latest
            xcode: "latest-stable"
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
      - name: Package checks
        run: |
          swift package resolve
          swift test
          swift build -c release
